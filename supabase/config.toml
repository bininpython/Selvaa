project_id = "selva-plus"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
major_version = 17

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**"]
enable_signup = true

[functions.username-signup]
verify_jwt = false

[functions.password-recovery]
verify_jwt = false

[storage]
enabled = true
file_size_limit = "25MiB"
